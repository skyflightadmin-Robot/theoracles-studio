# Netlify deploy config for theoracles.studio
# Committed so the build is reproducible across Netlify + local + CI.

[build]
  # Astro's build outputs static files to ./dist by default.
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro + Tailwind v4 need Node 20+.
  NODE_VERSION = "20"

# ---- skyflightmedia.com consolidation ---------------------------------
# SkyFlight Media's work now lives under The Oracles. Requires
# skyflightmedia.com to be added as a domain alias on this Netlify site
# (and its DNS pointed at Netlify) — until then these rules are inert.
[[redirects]]
  from = "https://skyflightmedia.com/*"
  to = "https://theoracles.studio/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.skyflightmedia.com/*"
  to = "https://theoracles.studio/"
  status = 301
  force = true

# ---- Old-IA safety redirects ------------------------------------------
# Routes that existed on earlier versions of the site. External links,
# bookmarks, or indexed pages still resolve cleanly.
[[redirects]]
  from = "/work"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/work/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/faq"
  to = "/pricing"
  status = 301
  force = true

# Long-cache for fingerprinted Astro assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long-cache for the hero reel + sphere photography (replaced by renaming).
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Security headers applied to every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "interest-cohort=()"
